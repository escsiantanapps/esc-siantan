name: Pemeriksaan kualitas

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build pemeriksaan tidak memakai kredensial atau backend production.
      VITE_SUPABASE_URL: https://qa-local.supabase.co
      VITE_SUPABASE_ANON_KEY: qa-local-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
