<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Tahap 4: Pohon berbuah, burung bernaung (Mat 13:32) -->
  <circle cx="100" cy="100" r="88" fill="rgba(255,255,255,0.10)"/>
  <path d="M26 152 Q100 138 174 152" stroke="rgba(255,255,255,0.85)" stroke-width="4" stroke-linecap="round"/>
  <!-- batang -->
  <path d="M100 150 L100 98 M100 118 L80 102 M100 110 L120 96" stroke="rgba(255,255,255,0.95)" stroke-width="6" stroke-linecap="round"/>
  <!-- tajuk -->
  <circle cx="100" cy="72" r="32" fill="rgba(255,255,255,0.9)"/>
  <circle cx="68" cy="88" r="20" fill="rgba(255,255,255,0.7)"/>
  <circle cx="132" cy="88" r="20" fill="rgba(255,255,255,0.7)"/>
  <!-- buah -->
  <g fill="rgba(240,120,90,0.95)">
    <circle cx="86" cy="66" r="6"/>
    <circle cx="114" cy="60" r="6"/>
    <circle cx="102" cy="86" r="6"/>
    <circle cx="70" cy="96" r="5"/>
    <circle cx="134" cy="96" r="5"/>
  </g>
  <!-- burung terbang -->
  <g stroke="rgba(255,255,255,0.95)" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M40 40 q6-8 12 0 q6-8 12 0"/>
    <path d="M148 32 q5-7 10 0 q5-7 10 0"/>
  </g>
  <!-- burung hinggap -->
  <g fill="rgba(30,110,160,0.9)">
    <ellipse cx="100" cy="44" rx="8" ry="6"/>
    <circle cx="107" cy="40" r="4"/>
    <path d="M92 44 l-8 3 8 2z"/>
  </g>
  <path d="M110 39 l5 1" stroke="rgba(240,180,60,1)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
