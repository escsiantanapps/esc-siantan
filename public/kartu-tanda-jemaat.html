<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1013, initial-scale=1">
<title>Kartu Tanda Jemaat — ESC Siantan</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #e5e7eb; display: flex; justify-content: center; padding: 24px; font-family: 'Segoe UI', Arial, sans-serif; }

  /* Ukuran kartu ID (CR80 85.6x54mm) @ ~300dpi = 1013x638 */
  .card {
    position: relative;
    width: 1013px;
    height: 638px;
    border-radius: 34px;
    overflow: hidden;
    background: linear-gradient(135deg, #0098cc 0%, #0077b6 55%, #005c8e 100%);
    color: #fff;
    box-shadow: 0 20px 50px -18px rgba(0,0,0,.5);
  }

  /* Aksen dekoratif */
  .blob1 { position: absolute; top: -140px; right: -120px; width: 420px; height: 420px; border-radius: 50%; background: rgba(255,255,255,.10); }
  .blob2 { position: absolute; bottom: -160px; left: -100px; width: 380px; height: 380px; border-radius: 50%; background: rgba(0,0,0,.10); }

  /* Watermark emblem gereja (samar) — GANTI dengan logo GBI resmi di Canva */
  .watermark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: .10;
  }
  .watermark svg { width: 460px; height: 460px; }

  .inner { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 40px 48px; }

  /* Header */
  .header { display: flex; align-items: center; gap: 18px; }
  .badge {
    width: 74px; height: 74px; border-radius: 18px; background: rgba(255,255,255,.16);
    border: 1.5px solid rgba(255,255,255,.5); display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .badge svg { width: 44px; height: 44px; }
  .church { line-height: 1.1; }
  .church .name { font-size: 34px; font-weight: 800; letter-spacing: .5px; }
  .church .sub { font-size: 16px; font-weight: 600; color: rgba(255,255,255,.82); letter-spacing: 3px; margin-top: 2px; }
  .title-pill {
    margin-left: auto; align-self: flex-start; background: #fff; color: #0077b6;
    font-size: 15px; font-weight: 800; letter-spacing: 2px; padding: 9px 18px; border-radius: 999px;
  }

  /* Body */
  .body { flex: 1; display: flex; gap: 40px; align-items: center; margin-top: 26px; }
  .photo {
    width: 210px; height: 260px; border-radius: 20px; flex: 0 0 auto;
    background: rgba(255,255,255,.14); border: 2px dashed rgba(255,255,255,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(255,255,255,.85);
  }
  .photo svg { width: 58px; height: 58px; }
  .photo span { font-size: 15px; font-weight: 600; }

  .fields { flex: 1; }
  .row { margin-bottom: 20px; }
  .row .label { font-size: 14px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,.72); }
  .row .value { font-size: 24px; font-weight: 700; margin-top: 4px; border-bottom: 1.5px solid rgba(255,255,255,.35); padding-bottom: 8px; }
  .row .value.placeholder { color: rgba(255,255,255,.6); font-weight: 500; }
  .grid2 { display: flex; gap: 30px; }
  .grid2 .row { flex: 1; }

  /* Footer */
  .footer {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid rgba(255,255,255,.25); padding-top: 16px; margin-top: 6px;
  }
  .footer .note { font-size: 15px; color: rgba(255,255,255,.85); font-weight: 500; }
  .footer .nij { font-size: 15px; font-weight: 700; letter-spacing: 1px; }
</style>
</head>
<body>
  <div class="card" data-document-role="page" data-label="Kartu Tanda Jemaat">
    <div class="blob1"></div>
    <div class="blob2"></div>

    <!-- Watermark emblem gereja (merpati + salib) — ganti dgn logo GBI resmi -->
    <div class="watermark">
      <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="100" cy="100" r="94" stroke="#fff" stroke-width="4"/>
        <!-- Salib -->
        <rect x="92" y="70" width="16" height="86" rx="3" fill="#fff"/>
        <rect x="72" y="92" width="56" height="16" rx="3" fill="#fff"/>
        <!-- Merpati sederhana di atas salib -->
        <path d="M100 34c-14 6-24 4-30-2 2 12 10 18 18 20-8 4-12 10-12 18 8-8 16-10 24-9 8-1 16 1 24 9 0-8-4-14-12-18 8-2 16-8 18-20-6 6-16 8-30 2z" fill="#fff"/>
      </svg>
    </div>

    <div class="inner">
      <!-- Header -->
      <div class="header">
        <div class="badge">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="21" y="8" width="6" height="34" rx="2" fill="#fff"/>
            <rect x="13" y="17" width="22" height="6" rx="2" fill="#fff"/>
          </svg>
        </div>
        <div class="church">
          <div class="name">ESC SIANTAN</div>
          <div class="sub">GEREJA BETHEL INDONESIA</div>
        </div>
        <div class="title-pill">KARTU TANDA JEMAAT</div>
      </div>

      <!-- Body -->
      <div class="body">
        <div class="photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
          </svg>
          <span>Pas Foto</span>
        </div>

        <div class="fields">
          <div class="row">
            <div class="label">Nama Lengkap</div>
            <div class="value placeholder">........................................</div>
          </div>
          <div class="grid2">
            <div class="row">
              <div class="label">NIJ</div>
              <div class="value placeholder">..........</div>
            </div>
            <div class="row">
              <div class="label">Komsel</div>
              <div class="value placeholder">.................</div>
            </div>
          </div>
          <div class="row">
            <div class="label">Tanggal Lahir</div>
            <div class="value placeholder">.................</div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="footer">
        <div class="note">Berlaku 1 tahun sejak diterbitkan</div>
        <div class="nij">escsiantan.my.id</div>
      </div>
    </div>
  </div>
</body>
</html>
