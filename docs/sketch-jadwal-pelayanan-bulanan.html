<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Jadwal Pelayanan Bulanan - ESC Siantan</title>
<style>
  :root { color-scheme:light; --bg:#f6f7f9; --surface:#fff; --ink:#20252d; --muted:#626b78; --line:#dde1e7; --control:#edf0f4; --brand:#dd431b; --brand-soft:#fff1eb; --teal:#10665e; --teal-soft:#eaf5f3; --yellow:#fff4cf; --red:#b32d32; --red-soft:#fff0f0; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 "Segoe UI",Arial,sans-serif; letter-spacing:0; }
  body.dark { color-scheme:dark; --bg:#17191d; --surface:#22252b; --ink:#f1f3f6; --muted:#acb3bf; --line:#414650; --control:#343942; --brand:#ff754f; --brand-soft:#452b23; --teal:#91d8c9; --teal-soft:#253c37; --yellow:#423b21; --red:#ff989a; --red-soft:#462b30; }
  button,input,select { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:disabled { cursor:default; }
  button:focus-visible,input:focus-visible,select:focus-visible { outline:2px solid var(--brand); outline-offset:3px; }
  svg { vertical-align:middle; flex-shrink:0; }
  .topbar { display:flex; align-items:center; gap:12px; min-height:64px; padding:12px 28px; background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:9px; font-weight:700; white-space:nowrap; }
  .brand img { width:32px; height:32px; object-fit:contain; }
  .tag { display:inline-flex; align-items:center; gap:5px; padding:3px 7px; border:1px solid var(--line); border-radius:4px; color:var(--muted); font-size:11px; font-weight:600; white-space:nowrap; }
  .topbar .tag { margin-left:auto; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; padding:0; border:1px solid var(--line); border-radius:5px; background:var(--surface); }
  .icon-btn:hover,.command:hover { background:var(--control); }
  .shell { max-width:1560px; margin:auto; padding:24px 28px 32px; }
  .heading { display:flex; align-items:center; gap:14px; justify-content:space-between; margin-bottom:18px; }
  h1 { margin:0; font-size:24px; font-weight:650; }
  h2 { margin:0; font-size:17px; font-weight:650; }
  p { margin:0; }
  .persona { display:flex; padding:3px; gap:3px; background:var(--control); border-radius:6px; }
  .persona button { border:0; border-radius:4px; padding:7px 13px; background:transparent; color:var(--muted); font-size:13px; }
  .persona button[aria-pressed="true"] { background:var(--surface); color:var(--ink); outline:1px solid var(--line); font-weight:650; }
  .toolbar { display:flex; align-items:center; flex-wrap:wrap; gap:10px; padding:14px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  .month-control { display:flex; gap:6px; align-items:center; }
  input[type="month"],select,.search-input,.text-input { min-height:36px; padding:7px 10px; border:1px solid var(--line); border-radius:5px; background:var(--surface); }
  input[type="month"] { width:186px; }
  select { max-width:210px; }
  .account { display:inline-flex; align-items:center; gap:6px; color:var(--muted); margin-left:auto; font-size:13px; }
  .command { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:36px; padding:7px 12px; border:1px solid var(--line); border-radius:5px; background:var(--surface); white-space:nowrap; }
  .command.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .summary { display:flex; align-items:center; flex-wrap:wrap; gap:16px; padding:13px 0; color:var(--muted); font-size:13px; }
  .summary strong { color:var(--ink); }
  .summary .draft { background:var(--yellow); color:var(--ink); border-color:transparent; }
  .summary .conflict { display:inline-flex; align-items:center; gap:5px; color:var(--red); font-weight:600; }
  .date-tabs { display:none; }
  .table-scroll { overflow-x:auto; background:var(--surface); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
  table { border-collapse:collapse; width:100%; table-layout:fixed; min-width:950px; }
  th,td { border:1px solid var(--line); vertical-align:middle; }
  thead th { background:var(--control); padding:12px 10px; text-align:left; font-size:14px; font-weight:650; }
  thead th:first-child { width:200px; }
  .date-head { display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .date-head small { font-size:11px; font-weight:400; color:var(--muted); }
  tbody th { padding:7px 12px; text-align:left; font-size:13px; font-weight:600; background:var(--surface); }
  tbody th small { display:flex; gap:5px; align-items:center; color:var(--muted); font-weight:400; font-size:11px; margin-top:1px; }
  .service-row th,.service-row td { background:var(--teal-soft); color:var(--teal); padding:10px 12px; }
  .service-row th { font-size:14px; font-weight:700; }
  .service-row td { font-size:12px; }
  .service-row strong { display:block; font-size:13px; }
  .team-row th,.team-row td { background:var(--yellow); }
  .slot { display:flex; align-items:center; justify-content:space-between; gap:6px; width:100%; min-height:39px; padding:8px 12px; border:0; background:transparent; text-align:left; font-size:13px; }
  .slot:not(:disabled):hover { background:var(--control); }
  .slot:disabled { opacity:1; color:var(--ink); }
  .slot.empty { color:var(--muted); }
  .slot.issue { background:var(--red-soft); color:var(--red); }
  .slot-names { overflow-wrap:anywhere; }
  .slot .lock { color:var(--muted); opacity:.7; }
  .meta-heading { display:flex; align-items:center; gap:10px; margin:22px 0 10px; }
  .dress-table { min-width:950px; }
  .dress-table th { width:200px; }
  .print-title { display:none; }
  .personal { max-width:820px; }
  .personal-month { padding:16px 0; border-top:1px solid var(--line); display:flex; align-items:center; flex-wrap:wrap; gap:9px; }
  .personal h2 { font-size:20px; }
  .duty { display:grid; grid-template-columns:68px 1fr auto; gap:18px; align-items:start; padding:20px 0; border-bottom:1px solid var(--line); }
  .day { text-align:center; padding-top:2px; }
  .day b { display:block; font-size:28px; line-height:1.2; }
  .day span { color:var(--muted); font-size:12px; }
  .duty h3 { margin:0 0 5px; font-size:17px; }
  .duty .details { color:var(--muted); font-size:13px; margin:4px 0; }
  .duty .task { display:inline-block; padding:3px 8px; margin:8px 7px 0 0; border-radius:4px; background:var(--teal-soft); color:var(--teal); font-weight:600; }
  .duty .tag { border:0; background:var(--teal-soft); color:var(--teal); }
  .empty-state { padding:50px 16px; text-align:center; color:var(--muted); border-top:1px solid var(--line); }
  .empty-state h3 { font-size:17px; color:var(--ink); }
  dialog { width:min(480px,calc(100% - 28px)); max-height:calc(100dvh - 40px); padding:0; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .dialog-heading { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:17px 20px; border-bottom:1px solid var(--line); }
  .dialog-content { padding:16px 20px; }
  .context { font-size:13px; color:var(--muted); margin-bottom:14px; }
  .context strong { display:block; color:var(--ink); font-size:14px; margin-bottom:3px; }
  .search-box { display:flex; align-items:center; gap:7px; padding:0 10px; border:1px solid var(--line); border-radius:5px; }
  .search-input { width:100%; border:0; padding-left:0; background:transparent; }
  .member-list { max-height:240px; overflow-y:auto; margin-top:8px; }
  .member { display:flex; gap:10px; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .member input { width:18px; height:18px; accent-color:var(--brand); flex-shrink:0; }
  .member small { display:block; color:var(--muted); font-size:12px; }
  .member-status { color:var(--teal); margin-left:auto; font-size:12px; }
  .dialog-content label[for="textValue"] { display:block; margin-bottom:7px; font-weight:600; }
  .text-input { width:100%; }
  .warning { display:flex; align-items:flex-start; gap:8px; padding:10px; margin-top:14px; background:var(--red-soft); color:var(--red); border-radius:4px; font-size:13px; }
  .warning p + p { margin-top:5px; }
  .dialog-footer { padding:14px 20px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--line); }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); padding:10px 16px; border:1px solid var(--line); border-radius:6px; background:var(--surface); color:var(--ink); box-shadow:0 4px 20px #0002; z-index:10; font-size:13px; width:max-content; max-width:calc(100% - 32px); }
  [hidden] { display:none !important; }
  @media(max-width:700px) {
    .topbar { padding:10px 16px; min-height:56px; gap:7px; }
    .brand { font-size:13px; }
    .brand img { width:28px; height:28px; }
    .topbar .tag { font-size:9px; padding:3px 5px; }
    .topbar .icon-btn { width:32px; height:32px; }
    .shell { padding:18px 16px 24px; }
    .heading { align-items:flex-start; flex-direction:column; gap:12px; margin-bottom:14px; }
    h1 { font-size:22px; }
    .persona { width:100%; }
    .persona button { flex:1; min-height:38px; padding:6px 5px; font-size:13px; }
    .toolbar { gap:8px; }
    .month-control { width:100%; }
    input[type="month"] { flex:1; width:0; min-height:40px; }
    .month-control .icon-btn { height:40px; width:40px; }
    .toolbar select { width:calc(50% - 4px); max-width:none; font-size:12px; min-height:40px; }
    .toolbar .account { margin-left:0; flex:1; font-size:12px; }
    .toolbar .command { min-height:40px; font-size:12px; }
    .summary { gap:9px 12px; font-size:12px; }
    .date-tabs { display:flex; gap:4px; margin:0 0 10px; }
    .date-tabs button { flex:1; min-width:0; min-height:42px; border:1px solid var(--line); border-radius:5px; background:var(--surface); padding:5px 3px; font-size:12px; }
    .date-tabs button[aria-pressed="true"] { border-color:var(--brand); background:var(--brand-soft); color:var(--brand); font-weight:700; }
    table,.dress-table { min-width:0; }
    thead th:first-child,.dress-table th { width:126px; }
    thead th { padding:10px 8px; font-size:12px; }
    tbody th { padding:8px; font-size:12px; }
    tbody th small { font-size:10px; }
    .date-column:not(.selected-date) { display:none; }
    .date-head { flex-direction:column; align-items:flex-start; gap:0; }
    .service-row th,.service-row td { padding:10px 8px; }
    .service-row th,.service-row strong { font-size:12px; }
    .service-row td { font-size:11px; }
    .slot { min-height:47px; padding:9px 8px; font-size:13px; }
    .slot svg { width:14px; }
    .meta-heading { margin-top:18px; }
    .meta-heading h2 { font-size:16px; }
    .duty { grid-template-columns:45px 1fr; gap:12px; padding:18px 0; }
    .duty > .tag { grid-column:2; width:max-content; }
    .day b { font-size:25px; }
    .duty h3 { font-size:16px; }
    .dialog-content { padding:14px 16px; }
    .dialog-heading,.dialog-footer { padding:14px 16px; }
  }
  @media print {
    @page { size:A3 landscape; margin:10mm; }
    :root,body.dark { color-scheme:light; --surface:#fff; --ink:#111; --muted:#555; --line:#999; --control:#eee; --teal:#15594e; --teal-soft:#e9f1ee; --yellow:#fff0c4; --red:#9e1921; --red-soft:#ffe6e6; }
    body { background:#fff; font-size:10px; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .topbar,.heading,.toolbar,.summary,.date-tabs,.toast,dialog { display:none !important; }
    .print-title { display:block; margin-bottom:8px; font-size:16px; font-weight:700; }
    .shell { padding:0; max-width:none; }
    .table-scroll { overflow:visible; border:0; }
    table,.dress-table { min-width:0; }
    .date-column:not(.selected-date) { display:table-cell; }
    thead { display:table-header-group; }
    thead th:first-child,.dress-table th { width:150px; }
    thead th { padding:5px; font-size:11px; }
    tbody th,.service-row th,.service-row td { padding:4px 6px; font-size:10px; }
    tbody th small { font-size:8px; }
    .service-row strong { font-size:10px; }
    .slot { min-height:22px; padding:4px 6px; font-size:10px; }
    tr { break-inside:avoid; }
    .meta-heading { margin:10px 0 5px; }
    .meta-heading h2 { font-size:12px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="../public/icons/icon-192.png" alt="Logo ESC"><span>ESC SIANTAN</span></div>
    <span class="tag">SKETCH / DATA CONTOH</span>
    <button class="icon-btn" id="theme" type="button" title="Mode gelap" aria-label="Mode gelap" data-icon="Moon"></button>
  </header>
  <main class="shell">
    <div class="heading">
      <h1 id="pageTitle">Kelola Jadwal Pelayanan</h1>
      <nav class="persona" aria-label="Tampilan contoh">
        <button type="button" data-persona="admin" aria-pressed="true">Admin</button>
        <button type="button" data-persona="mh" aria-pressed="false">MH Musik</button>
        <button type="button" data-persona="volunteer" aria-pressed="false">Volunteer</button>
      </nav>
    </div>
    <div class="toolbar">
      <div class="month-control">
        <button class="icon-btn" id="prevMonth" type="button" aria-label="Bulan sebelumnya" title="Bulan sebelumnya" data-icon="ChevronLeft"></button>
        <input id="month" type="month" value="2026-10" aria-label="Bulan jadwal">
        <button class="icon-btn" id="nextMonth" type="button" aria-label="Bulan berikutnya" title="Bulan berikutnya" data-icon="ChevronRight"></button>
      </div>
      <select id="activity" aria-label="Filter kegiatan"><option value="all">Semua ibadah / kelas</option><option value="kids">Ibadah Kids</option><option value="pagi">Ibadah Pagi</option><option value="nextgen">Ibadah Nextgen</option><option value="kelas">Kelas Pemuridan</option></select>
      <select id="ministry" aria-label="Filter bagian"><option value="all">Semua bagian</option><option value="Worship">Worship</option><option value="Kids">Kids</option><option value="Musik">Musik</option><option value="Multimedia">Multimedia</option><option value="Frontline">Frontline</option><option value="Pengajaran">Pengajaran</option></select>
      <span class="account" id="account"></span>
      <button class="command" id="pdf" type="button"><span data-icon="Printer"></span>Ekspor PDF</button>
    </div>
    <section id="manager" aria-label="Matriks jadwal bulanan">
      <div id="summary" class="summary"></div>
      <nav class="date-tabs" id="dateTabs" aria-label="Tanggal pelayanan"></nav>
      <div class="print-title" id="printTitle"></div>
      <div class="table-scroll"><table id="matrix" aria-label="Jadwal pelayanan per tanggal"></table></div>
      <div class="meta-heading"><h2>Dresscode &amp; Catatan</h2></div>
      <div class="table-scroll"><table id="dress" class="dress-table" aria-label="Dresscode per tanggal"></table></div>
    </section>
    <section class="personal" id="personal" aria-label="Jadwal pelayanan pribadi" hidden></section>
  </main>
  <dialog id="editor" aria-labelledby="dialogTitle">
    <form id="editForm">
      <div class="dialog-heading"><h2 id="dialogTitle">Penugasan Pelayan</h2><button class="icon-btn" id="closeDialog" type="button" aria-label="Tutup" title="Tutup" data-icon="X"></button></div>
      <div class="dialog-content">
        <div class="context" id="context"></div>
        <div id="personEditor"><div class="search-box"><span data-icon="Search"></span><input id="memberSearch" class="search-input" placeholder="Cari anggota" aria-label="Cari anggota"></div><div class="member-list" id="members"></div></div>
        <div id="textEditor" hidden><label id="textLabel" for="textValue">Isian</label><input class="text-input" id="textValue" maxlength="120"></div>
        <div class="warning" id="warning" role="alert" hidden></div>
      </div>
      <div class="dialog-footer"><button class="command" type="button" id="cancelEdit">Batal</button><button class="command primary" type="submit"><span data-icon="Save"></span>Simpan Draf</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <script>
    // Ikon berasal dari lucide-react lokal agar sketch tidak memerlukan jaringan.
    const icons = {"ChevronLeft":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-left\" aria-hidden=\"true\"><path d=\"m15 18-6-6 6-6\"></path></svg>","ChevronRight":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-chevron-right\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"></path></svg>","Printer":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-printer\" aria-hidden=\"true\"><path d=\"M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2\"></path><path d=\"M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6\"></path><rect x=\"6\" y=\"14\" width=\"12\" height=\"8\" rx=\"1\"></rect></svg>","LockKeyhole":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-lock-keyhole\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"16\" r=\"1\"></circle><rect x=\"3\" y=\"10\" width=\"18\" height=\"12\" rx=\"2\"></rect><path d=\"M7 10V7a5 5 0 0 1 10 0v3\"></path></svg>","CalendarDays":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-calendar-days\" aria-hidden=\"true\"><path d=\"M8 2v4\"></path><path d=\"M16 2v4\"></path><rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"></rect><path d=\"M3 10h18\"></path><path d=\"M8 14h.01\"></path><path d=\"M12 14h.01\"></path><path d=\"M16 14h.01\"></path><path d=\"M8 18h.01\"></path><path d=\"M12 18h.01\"></path><path d=\"M16 18h.01\"></path></svg>","Save":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-save\" aria-hidden=\"true\"><path d=\"M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z\"></path><path d=\"M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7\"></path><path d=\"M7 3v4a1 1 0 0 0 1 1h7\"></path></svg>","UsersRound":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-users-round\" aria-hidden=\"true\"><path d=\"M18 21a8 8 0 0 0-16 0\"></path><circle cx=\"10\" cy=\"8\" r=\"5\"></circle><path d=\"M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3\"></path></svg>","Search":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-search\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"8\"></circle><path d=\"m21 21-4.3-4.3\"></path></svg>","X":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-x\" aria-hidden=\"true\"><path d=\"M18 6 6 18\"></path><path d=\"m6 6 12 12\"></path></svg>","TriangleAlert":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-triangle-alert\" aria-hidden=\"true\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\"></path><path d=\"M12 9v4\"></path><path d=\"M12 17h.01\"></path></svg>","Sun":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-sun\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"></circle><path d=\"M12 2v2\"></path><path d=\"M12 20v2\"></path><path d=\"m4.93 4.93 1.41 1.41\"></path><path d=\"m17.66 17.66 1.41 1.41\"></path><path d=\"M2 12h2\"></path><path d=\"M20 12h2\"></path><path d=\"m6.34 17.66-1.41 1.41\"></path><path d=\"m19.07 4.93-1.41 1.41\"></path></svg>","Moon":"<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" class=\"lucide lucide-moon\" aria-hidden=\"true\"><path d=\"M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z\"></path></svg>"};
    const icon = name => icons[name] || '';
    const $ = selector => document.querySelector(selector);
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const people = [
      ['w1','Alya','Worship'],['w2','Tara','Worship'],['w3','Maya','Worship'],['w4','Nadia','Worship'],
      ['m1','Bima','Musik'],['m2','Raka','Musik'],['m3','Kevin','Musik'],['m4','Nico','Musik'],['m5','Ian','Musik'],['m6','Luki','Musik'],['m7','Dimas','Musik'],['m8','Rian','Musik'],
      ['k1','Elin','Kids'],['k2','Fani','Kids'],['k3','Vera','Kids'],['k4','Nia','Kids'],['k5','Lena','Kids'],['k6','Eva','Kids'],
      ['v1','Doni','Multimedia'],['v2','Andra','Multimedia'],['v3','Mika','Multimedia'],['v4','Rena','Multimedia'],['v5','Hana','Multimedia'],['v6','Yuda','Multimedia'],
      ['f1','Ina','Frontline'],['f2','Tomi','Frontline'],['f3','Yani','Frontline'],
      ['p1','David','Pengajaran'],['p2','Ruth','Pengajaran'],['p3','Sari','Pengajaran']
    ].map(([id,name,ministry]) => ({id,name,ministry}));
    const person = id => people.find(member => member.id === id);
    const row = (id,label,ministry,type='people') => ({id,label,ministry,type});
    const activities = [
      {id:'kids',title:'Ibadah Kids',time:'07.00 - 08.30',start:420,end:510,location:'Ruang Kids',pic:['Fani','Elin','Vera','Nia'],rows:[row('wl','WL','Worship'),row('singer','Singer','Worship'),row('teacher','Pengajar','Kids'),row('material','Materi','Kids','text'),row('host','Host','Kids'),row('team','Tim Pemusik','Musik','text'),row('drum','Drum','Musik'),row('bass','Bass','Musik'),row('guitar','Gitar','Musik'),row('sound','Sound','Multimedia'),row('media','Operator Media','Multimedia'),row('welcome','Penyambutan','Frontline')]},
      {id:'pagi',title:'Ibadah Pagi',time:'08.00 - 09.30',start:480,end:570,location:'Aula Utama',pic:['Tara','Maya','Nadia','Alya'],rows:[row('wl','WL','Worship'),row('singer','Singer','Worship'),row('team','Tim Pemusik','Musik','text'),row('drum','Drum','Musik'),row('bass','Bass','Musik'),row('guitar','Gitar','Musik'),row('sound','Sound','Multimedia'),row('media','Operator Media','Multimedia')]},
      {id:'nextgen',title:'Ibadah Nextgen',time:'10.00 - 11.30',start:600,end:690,location:'Aula Utama',pic:['Alya','Tara','Maya','Nadia'],rows:[row('wl','WL','Worship'),row('singer','Singer','Worship'),row('team','Tim Pemusik','Musik','text'),row('drum','Drum','Musik'),row('bass','Bass','Musik'),row('guitar','Gitar','Musik'),row('sound','Sound','Multimedia'),row('media','Operator Media','Multimedia')]},
      {id:'kelas',title:'Kelas Pemuridan',time:'16.00 - 17.00',start:960,end:1020,location:'Ruang Kelas 1',pic:['David','Ruth','Sari','David'],rows:[row('teacher','Pengajar','Pengajaran'),row('material','Materi','Pengajaran','text'),row('host','Pendamping','Pengajaran')]}
    ];
    const values = new Map();
    let mode = 'admin';
    let selectedDate = 0;
    let edit = null;
    let chosen = new Set();
    let toastTimer;
    const dates = () => {
      const [year,month] = $('#month').value.split('-').map(Number);
      const result = [];
      if (!year || !month) return result;
      for (let day=1; day<=31; day++) {
        const date = new Date(Date.UTC(year,month-1,day));
        if (date.getUTCMonth() !== month-1) break;
        if (date.getUTCDay() === 0) result.push(date);
      }
      return result;
    };
    const shortDate = date => date.toLocaleDateString('id-ID',{day:'numeric',month:'short',timeZone:'UTC'});
    const longDate = date => date.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
    const monthTitle = () => dates()[0]?.toLocaleDateString('id-ID',{month:'long',year:'numeric',timeZone:'UTC'}) || '';
    const key = (activity,rowId,index) => `${$('#month').value}:${activity}:${rowId}:${index}`;
    const defaults = (activity,item,index) => {
      if (item.type === 'text') {
        if (item.id === 'team') return `Tim ${1 + ((index + (activity.id==='pagi' ? 1 : activity.id==='nextgen' ? 2 : 0))%3)}`;
        return activity.id==='kelas' ? ['Identitas dalam Kristus','Doa dan Firman','Hidup dalam Komunitas','Pelayanan','Kesaksian'][index] : ['Buah Roh & Games','Doa','Kasih kepada Sesama','Bersyukur','Persahabatan'][index];
      }
      if ($('#month').value !== '2026-10') return [];
      const assigned = {
        kids:{wl:[['w1'],['w2'],['w3'],['w4']],singer:[['w2','w3'],['w3','w4'],['w4','w1'],['w1','w2']],teacher:[['k1','k2'],['k3'],['k4','k5'],['k6']],host:[['k3'],['k4'],['k6'],['k1']],drum:[['m1'],['m1'],['m2'],['m2']],bass:[['m3'],['m3'],['m4'],['m4']],guitar:[['m5'],['m5'],['m6'],['m6']],sound:[['v1'],['v1'],['v2'],['v2']],media:[['v3'],[],['v4'],['v4']],welcome:[['f1'],['f2'],['f3'],['f1']]},
        pagi:{wl:[['w4'],['w1'],['w2'],['w3']],singer:[[],[],[],[]],drum:[['m1'],['m7'],['m7'],['m7']],bass:[['m4'],['m4'],['m3'],['m3']],guitar:[['m6'],['m6'],['m5'],['m5']],sound:[['v5'],['v5'],['v6'],['v6']],media:[['v6'],['v6'],['v5'],[]]},
        nextgen:{wl:[['w1'],['w2'],['w3'],['w4']],singer:[['w2','w3'],['w3','w4'],['w4','w1'],['w1','w2']],drum:[['m2'],['m2'],['m1'],['m1']],bass:[['m3'],['m3'],['m4'],['m4']],guitar:[['m5'],['m5'],['m6'],['m6']],sound:[['v1'],['v1'],['v2'],['v2']],media:[['v3'],['v3'],['v4'],['v4']]},
        kelas:{teacher:[['p1'],['p2'],['p3'],['p1']],host:[['p2'],['p3'],['p1'],['p2']]}
      };
      return assigned[activity.id]?.[item.id]?.[index] || [];
    };
    const value = (activity,item,index) => values.has(key(activity.id,item.id,index)) ? values.get(key(activity.id,item.id,index)) : defaults(activity,item,index);
    const canEdit = item => mode==='admin' || (mode==='mh' && item.ministry==='Musik');
    const conflicts = (activity,item,index,ids=value(activity,item,index)) => {
      if (item.type !== 'people') return [];
      const matches = [];
      for (const other of activities) {
        if (other.id === activity.id || activity.start>=other.end || other.start>=activity.end) continue;
        for (const position of other.rows.filter(item=>item.type==='people')) {
          for (const id of value(other,position,index)) if (ids.includes(id)) matches.push({person:person(id),activity:other,position});
        }
      }
      return matches;
    };
    const visibleActivities = () => activities.filter(activity=>$('#activity').value==='all' || activity.id===$('#activity').value);
    function cell(activity,item,index) {
      const content = value(activity,item,index);
      const issue = conflicts(activity,item,index);
      const writable = canEdit(item);
      const title = issue.length ? `Bentrok: ${issue.map(hit=>`${hit.person.name} / ${hit.activity.title} / ${hit.activity.time}`).join('; ')}` : `${writable?'Ubah':'Baca'} ${item.label} / ${activity.title} / ${shortDate(dates()[index])}`;
      return `<td class="date-column ${index===selectedDate?'selected-date':''}"><button type="button" class="slot ${!content.length?'empty':''} ${issue.length?'issue':''}" ${writable?'':'disabled'} data-edit="${activity.id}:${item.id}:${index}" title="${esc(title)}" aria-label="${esc(title)}"><span class="slot-names">${item.type==='people' ? (content.map(id=>esc(person(id).name)).join(', ') || 'Belum diisi') : esc(content || '-')}</span>${issue.length ? icon('TriangleAlert') : !writable ? `<span class="lock">${icon('LockKeyhole')}</span>` : ''}</button></td>`;
    }
    function renderMatrix() {
      const monthDates = dates();
      selectedDate = Math.min(selectedDate,monthDates.length-1);
      let html = `<thead><tr><th scope="col">Posisi / Bagian</th>${monthDates.map((date,index)=>`<th scope="col" class="date-column ${index===selectedDate?'selected-date':''}"><div class="date-head"><span>${shortDate(date)}</span><small>Minggu</small></div></th>`).join('')}</tr></thead><tbody>`;
      let filled=0,total=0;
      const conflictPeople = new Set();
      for (const activity of visibleActivities()) {
        const filtered = activity.rows.filter(item=>$('#ministry').value==='all' || item.ministry===$('#ministry').value);
        if (!filtered.length) continue;
        html += `<tr class="service-row"><th scope="row">${activity.title}</th>${monthDates.map((date,index)=>`<td class="date-column ${index===selectedDate?'selected-date':''}"><strong>${activity.time} WIB</strong>${activity.location} &middot; PIC ${activity.pic[index%4]}</td>`).join('')}</tr>`;
        for (const item of filtered) {
          if (item.type==='people') for (let index=0;index<monthDates.length;index++) {
            total++; if (value(activity,item,index).length) filled++;
            for (const hit of conflicts(activity,item,index)) conflictPeople.add(`${index}:${hit.person.id}`);
          }
          html += `<tr class="${item.id==='team'?'team-row':''}"><th scope="row">${item.label}<small>${item.ministry}${!canEdit(item)?icon('LockKeyhole'):''}</small></th>${monthDates.map((date,index)=>cell(activity,item,index)).join('')}</tr>`;
        }
      }
      $('#matrix').innerHTML = html + '</tbody>';
      $('#summary').innerHTML = `<span class="tag draft">DRAF BULANAN</span><strong>${monthTitle()}</strong><span>${filled}/${total} posisi terisi</span><span>${total-filled} belum diisi</span>${conflictPeople.size?`<span class="conflict">${icon('TriangleAlert')} ${conflictPeople.size} anggota bentrok</span>`:''}`;
      $('#dateTabs').innerHTML = monthDates.map((date,index)=>`<button type="button" data-date="${index}" aria-pressed="${selectedDate===index}">${shortDate(date)}</button>`).join('');
      $('#printTitle').textContent = `ESC Siantan / Jadwal Pelayanan / ${monthTitle()} / DRAF - DATA CONTOH`;
      const dress = row('dress','Pakaian','Global','text');
      const note = row('note','Catatan','Global','text');
      const dressCell = (item,index) => {
        const content = values.get(key('global',item.id,index)) ?? (item.id==='dress'?['Blazer','Kemeja','Batik','Coklat','Bebas Rapi'][index]:(index===2?'Kids: batik':'-'));
        return `<td class="date-column ${index===selectedDate?'selected-date':''}"><button type="button" class="slot" ${mode==='admin'?'':'disabled'} data-edit="global:${item.id}:${index}" title="${mode==='admin'?'Ubah':'Baca'} ${item.label}">${esc(content)}${mode==='admin'?'':icon('LockKeyhole')}</button></td>`;
      };
      $('#dress').innerHTML = `<tbody>${[dress,note].map(item=>`<tr><th scope="row">${item.label}</th>${monthDates.map((date,index)=>dressCell(item,index)).join('')}</tr>`).join('')}</tbody>`;
    }
    function renderPersonal() {
      // Contoh terbit terpisah; perubahan Draf pengelola tidak muncul di halaman anggota.
      const duties = $('#month').value==='2026-10' ? [
        {date:0,activity:activities[0],task:'Drum',team:'Tim 1',dress:'Blazer'},
        {date:1,activity:activities[1],task:'Drum',team:'Tim 2',dress:'Kemeja'},
        {date:3,activity:activities[2],task:'Drum',team:'Tim 1',dress:'Coklat'}
      ] : [];
      $('#personal').innerHTML = `<div class="personal-month">${icon('CalendarDays')}<h2>${monthTitle()}</h2><span class="tag">TERBIT / CONTOH</span></div>` + (duties.length ? duties.map(duty=>`<article class="duty"><div class="day"><b>${dates()[duty.date].getUTCDate()}</b><span>MINGGU</span></div><div><h3>${duty.activity.title}</h3><p class="details">${duty.activity.time} WIB &middot; ${duty.activity.location}</p><span class="task">${duty.task}</span><span class="details">Musik &middot; ${duty.team}</span><p class="details">Dresscode: ${duty.dress}</p><p class="details">PIC: ${duty.activity.pic[duty.date]}</p></div><span class="tag">Dijadwalkan</span></article>`).join('') : '<div class="empty-state"><h3>Belum ada jadwal pelayanan</h3><p>Belum ada penugasan terbit pada bulan ini.</p></div>');
    }
    function render() {
      const isVolunteer = mode==='volunteer';
      $('#pageTitle').textContent = isVolunteer?'Jadwal Pelayanan Saya':'Kelola Jadwal Pelayanan';
      $('#manager').hidden = isVolunteer;
      $('#personal').hidden = !isVolunteer;
      $('#activity').hidden = isVolunteer;
      $('#ministry').hidden = isVolunteer;
      $('#pdf').hidden = isVolunteer;
      $('#account').innerHTML = `${icon(isVolunteer?'UsersRound':'LockKeyhole')} ${isVolunteer?'Bima / Volunteer':mode==='mh'?'MH / Musik':'Admin / Jadwal Pelayanan'}`;
      document.querySelectorAll('[data-persona]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.persona===mode)));
      if (isVolunteer) renderPersonal(); else renderMatrix();
    }
    function showToast(message) {
      clearTimeout(toastTimer); $('#toast').textContent=message; $('#toast').hidden=false;
      toastTimer=setTimeout(()=>$('#toast').hidden=true,3200);
    }
    function refreshWarning() {
      const hits = edit.item.type==='people' ? conflicts(edit.activity,edit.item,edit.index,[...chosen]) : [];
      $('#warning').hidden = !hits.length;
      $('#warning').innerHTML = hits.length ? `${icon('TriangleAlert')}<div><strong>Jam pelayanan bertumpuk</strong>${hits.map(hit=>`<p>${esc(hit.person.name)}: ${esc(hit.activity.title)} / ${hit.activity.time} / ${hit.position.label}</p>`).join('')}</div>` : '';
    }
    function renderMembers() {
      const search = $('#memberSearch').value.toLowerCase().trim();
      const candidates = people.filter(member=>member.ministry===edit.item.ministry && member.name.toLowerCase().includes(search));
      $('#members').innerHTML = candidates.length ? candidates.map(member=>`<label class="member"><input type="checkbox" value="${member.id}" ${chosen.has(member.id)?'checked':''}><span>${esc(member.name)}<small>${member.ministry}</small></span><span class="member-status">Aktif</span></label>`).join('') : '<p class="context">Anggota tidak ditemukan.</p>';
    }
    function openEditor(encoded) {
      const [activityId,rowId,indexRaw] = encoded.split(':');
      const index = Number(indexRaw);
      const activity = activities.find(activity=>activity.id===activityId) || {id:'global',title:'Dresscode & Catatan',time:''};
      const item = activityId==='global' ? row(rowId,rowId==='dress'?'Pakaian':'Catatan','Global','text') : activity.rows.find(item=>item.id===rowId);
      if (!canEdit(item)) return;
      edit = {activity,item,index};
      $('#dialogTitle').textContent = item.type==='people'?'Penugasan Pelayan':item.label;
      $('#context').innerHTML = `<strong>${esc(item.label)} / ${esc(activity.title)}</strong>${longDate(dates()[index])}${activity.time?` &middot; ${activity.time} WIB`:''}<br>${esc(item.ministry)}`;
      $('#personEditor').hidden = item.type!=='people';
      $('#textEditor').hidden = item.type==='people';
      if (item.type==='people') {
        chosen = new Set(value(activity,item,index)); $('#memberSearch').value=''; renderMembers();
      } else {
        $('#textLabel').textContent=item.label;
        $('#textValue').value = activityId==='global' ? (values.get(key('global',rowId,index)) ?? (rowId==='dress'?['Blazer','Kemeja','Batik','Coklat','Bebas Rapi'][index]:(index===2?'Kids: batik':'-'))) : value(activity,item,index);
      }
      refreshWarning(); $('#editor').showModal();
      (item.type==='people'?$('#memberSearch'):$('#textValue')).focus();
    }
    document.addEventListener('click',event=>{
      const editable=event.target.closest('[data-edit]');
      if (editable && !editable.disabled) openEditor(editable.dataset.edit);
      const personaButton=event.target.closest('[data-persona]');
      if (personaButton) { mode=personaButton.dataset.persona; render(); }
      const dateButton=event.target.closest('[data-date]');
      if (dateButton) { selectedDate=Number(dateButton.dataset.date); renderMatrix(); }
    });
    $('#members').addEventListener('change',event=>{ if(event.target.checked) chosen.add(event.target.value); else chosen.delete(event.target.value); refreshWarning(); });
    $('#memberSearch').addEventListener('input',renderMembers);
    $('#editForm').addEventListener('submit',event=>{
      event.preventDefault();
      if (!canEdit(edit.item)) return;
      // Peringatan ini hanya simulasi; kebijakan pengecualian masih menunggu keputusan.
      if (edit.item.type==='people' && conflicts(edit.activity,edit.item,edit.index,[...chosen]).length) { refreshWarning(); return; }
      values.set(key(edit.activity.id,edit.item.id,edit.index),edit.item.type==='people'?[...chosen]:$('#textValue').value.trim());
      $('#editor').close(); render(); showToast('Draf contoh diperbarui di sketch.');
    });
    for(const id of ['closeDialog','cancelEdit']) $(`#${id}`).addEventListener('click',()=>$('#editor').close());
    $('#month').addEventListener('change',()=>{ if (!$('#month').value) $('#month').value='2026-10'; selectedDate=0; render(); });
    for(const [id,delta] of [['prevMonth',-1],['nextMonth',1]]) $(`#${id}`).addEventListener('click',()=>{
      const [year,month]=$('#month').value.split('-').map(Number); const next=new Date(Date.UTC(year,month-1+delta,1));
      $('#month').value=`${next.getUTCFullYear()}-${String(next.getUTCMonth()+1).padStart(2,'0')}`; selectedDate=0; render();
    });
    $('#activity').addEventListener('change',render);
    $('#ministry').addEventListener('change',render);
    $('#pdf').addEventListener('click',()=>window.print());
    $('#theme').addEventListener('click',()=>{
      const dark=document.body.classList.toggle('dark'); $('#theme').innerHTML=icon(dark?'Sun':'Moon');
      $('#theme').title=dark?'Mode terang':'Mode gelap'; $('#theme').setAttribute('aria-label',$('#theme').title);
    });
    document.querySelectorAll('[data-icon]').forEach(element=>element.innerHTML=icon(element.dataset.icon));
    render();
  </script>
</body>
</html>
